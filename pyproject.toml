[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartseal"
version = "3.0.0"
description = "Seal what you ship. A signed receipt so anyone can verify what they received."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartseal", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartseal"
Issues = "https://github.com/SmartTasksOrg/sf-smartseal/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartseal/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartseal/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartseal = "sf_smartseal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
